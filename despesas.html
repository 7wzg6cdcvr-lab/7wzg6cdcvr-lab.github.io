<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0D12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<title>DC Despesas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
@font-face{font-family:'Cybertruck';src:url('fonts/Cybertruck-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap;}
:root{
  --bg:#0A0D12;--surface:#12161D;--surface2:#181D26;--surface3:#212938;
  --border:rgba(255,255,255,0.08);--border-soft:rgba(255,255,255,0.05);
  --text:#F2F4F7;--muted:#8B95A5;--muted2:#5C6576;
  --gold:#D2A13A;--gold-light:#F4D27A;
  --mint:#34D399;--coral:#FF6B5E;--sapphire:#5B8DEF;--amber:#F0A93A;
  --r:16px;--r-sm:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;padding-bottom:calc(24px + env(safe-area-inset-bottom));overscroll-behavior-y:contain;}

.topbar{position:sticky;top:0;z-index:60;background:#0D1117;border-bottom:1px solid var(--border-soft);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;min-width:0;flex:1}
.brand-logo{height:110px;width:auto;display:block}
.brand-txt{display:flex;flex-direction:column;margin-left:6px}
.brand-family{font-family:'Cybertruck',sans-serif;font-size:20px;letter-spacing:.06em;color:#B0B5BD;line-height:1.1}
.brand-sub{font-family:'Futura','Century Gothic',Arial,sans-serif;font-size:12px;font-weight:300;letter-spacing:.14em;color:var(--muted)}
.icon-btn{background:var(--surface3);color:var(--text);border:1px solid var(--border);border-radius:10px;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;text-decoration:none}
.icon-btn:active{transform:scale(.92)}
.icon-btn.spinning svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.app{padding:16px}

/* Grelha de meses */
.mes-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mes-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px 16px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s}
.mes-card:active{transform:scale(.97)}
.mes-card.current{border-color:var(--amber)}
.mes-card.current::after{content:'atual';position:absolute;top:8px;right:10px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--amber)}
.mes-label{font-size:17px;font-weight:700}
.mes-sub{font-size:11px;color:var(--muted);margin-top:4px}

/* Detalhe do mês */
.back-btn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;padding:0;display:flex;align-items:center;gap:5px;margin-bottom:16px}
.kpi-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--kpi-color,var(--amber))}
.kpi-label{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}
.kpi-value{font-family:'DM Mono',monospace;font-size:clamp(12px,3.5vw,16px);font-weight:500;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px}

/* Gráfico de barras horizontal */
.cat-row{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border-soft)}
.cat-row:last-child{border:none}
.cat-name{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-bar-bg{height:8px;background:var(--surface3);border-radius:4px;overflow:hidden}
.cat-bar{height:8px;border-radius:4px;background:var(--amber);transition:width .4s ease}
.cat-val{font-family:'DM Mono',monospace;font-size:11.5px;text-align:right;white-space:nowrap}

/* Skeleton */
.skel{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:var(--r-sm)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div id="app-content" style="display:none">

<div class="topbar">
  <div class="topbar-row">
    <div class="brand" style="display:flex;align-items:center">
      <img class="brand-logo" src="logo.png" alt="DC Family Finances">
      <span class="brand-sub-label">FINANCES</span>
    </div>
    <div style="display:flex;gap:8px">
      <a class="icon-btn" href="./index.html" title="Início">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      </a>
      <button class="icon-btn" id="refresh-btn" onclick="refresh()" title="Atualizar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="app" id="app">
  <!-- preenchido pelo JS -->
</div>
</div>

<script src="auth.js"></script>
<script src="tickets.js"></script>
<script src="push.js"></script>
<script>
const eur = v => (v<0?'-':'')+'€'+Math.abs(v).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2});
const $ = id => document.getElementById(id);
const API = () => Auth.API_URL + '?pin=' + encodeURIComponent(Auth.getStoredPin()||'');

let meses = [];
let currentView = 'grid'; // 'grid' | 'detail'

// ── Esqueleto enquanto carrega ────────────────────────────────
function showSkeleton(){
  $('app').innerHTML = `
    <div class="mes-grid">
      ${Array(6).fill('<div class="skel" style="height:74px"></div>').join('')}
    </div>`;
}
function showDetailSkeleton(label){
  $('app').innerHTML = `
    <button class="back-btn" onclick="showGrid()">‹ Todos os meses</button>
    <div style="font-size:18px;font-weight:700;margin-bottom:16px">${label}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px">
      ${Array(3).fill('<div class="skel" style="height:60px"></div>').join('')}
    </div>
    <div class="skel" style="height:300px"></div>`;
}

// ── Grelha de meses ───────────────────────────────────────────
const EMERGENCY_GOAL = 10000;
let globalKPIs = null; // carrega com loadIndex

function showGrid(){
  currentView = 'grid';
  $('refresh-btn').classList.remove('spinning');
  if (!meses.length) { showSkeleton(); loadIndex(); return; }
  renderGrid();
}

// ── Últimos 5 movimentos do mês atual ─────────────────────────
let movRecentes = [];
let movRecentesLoaded = false;
const TIPO_LABEL = { despesa:'Despesa', receita:'Receita', poupanca:'Poupança' };
const TIPO_COLOR = { despesa:'var(--coral)', receita:'var(--mint)', poupanca:'var(--sapphire)' };

function renderRecentesMovHTML(){
  if (!movRecentesLoaded) return `<div style="color:var(--muted);font-size:13px">A carregar…</div>`;
  if (!movRecentes.length) return `<div style="color:var(--muted);font-size:13px">Sem movimentos este mês.</div>`;
  return movRecentes.map(m=>`
    <div style="display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer"
         onclick="openEditMov(${JSON.stringify(m).replace(/"/g,'&quot;')})">
      <span style="width:8px;height:8px;border-radius:50%;background:${TIPO_COLOR[m.tipo]||'var(--muted)'};flex-shrink:0"></span>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.col1||'—'}${m.col2?' · '+m.col2:''}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">${m.data} · ${TIPO_LABEL[m.tipo]||m.tipo}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:${TIPO_COLOR[m.tipo]||'var(--text)'}">${eur(m.valor)}</div>
        <div style="font-size:10.5px;color:var(--muted2)">✏️ editar</div>
      </div>
    </div>`).join('');
}

function loadRecentesMovimentos(){
  fetch(API()+'&action=despesasRecentes').then(r=>r.json()).then(d=>{
    movRecentesLoaded = true;
    if (d.ok) movRecentes = d.recentes;
    const el = $('mov-recentes-list');
    if (el) el.innerHTML = renderRecentesMovHTML();
  }).catch(()=>{
    movRecentesLoaded = true;
    const el = $('mov-recentes-list');
    if (el) el.innerHTML = renderRecentesMovHTML();
  });
}

function renderGlobalKPIs(){
  if (!globalKPIs) return `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
      ${Array(4).fill('<div class="skel" style="height:62px"></div>').join('')}
    </div>`;
  const g = globalKPIs;
  const emergPct = Math.min(Math.round(g.totalPoup / EMERGENCY_GOAL * 100), 100);
  return `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
      <div class="kpi" style="--kpi-color:var(--mint)">
        <div class="kpi-label">Total Receitas</div>
        <div class="kpi-value">${eur(g.totalRec)}</div>
      </div>
      <div class="kpi" style="--kpi-color:var(--coral)">
        <div class="kpi-label">Total Despesas</div>
        <div class="kpi-value">${eur(g.totalDesp)}</div>
      </div>
      <div class="kpi" style="--kpi-color:var(--sapphire)">
        <div class="kpi-label">Total Poupanças</div>
        <div class="kpi-value">${eur(g.totalPoup)}</div>
      </div>
      <div class="kpi" style="--kpi-color:var(--amber)">
        <div class="kpi-label">Fundo Emergência</div>
        <div class="kpi-value">${emergPct}%</div>
        <div style="margin-top:6px;height:4px;background:var(--surface3);border-radius:2px">
          <div style="height:4px;border-radius:2px;background:var(--amber);width:${emergPct}%"></div>
        </div>
        <div style="font-size:10px;color:var(--muted2);margin-top:3px">${eur(g.totalPoup)} / €10.000</div>
      </div>
    </div>`;
}

function renderGrid(){
  $('app').innerHTML = renderGlobalKPIs() + `
    <div class="mes-grid">
      ${meses.map(m=>`
        <div class="mes-card${m.current?' current':''}" onclick="openMes('${m.id}','${m.label}',${!!m.current})">
          <div class="mes-label">${m.label}</div>
          <div class="mes-sub">${m.current?'Mês atual':'Ver detalhes'}</div>
        </div>`).join('')}
    </div>`;
}

async function loadIndex(){
  const r = await fetch(API()+'&action=despesasIndex');
  const d = await r.json();
  if (d.error) { $('app').innerHTML=`<p style="color:var(--coral)">${d.error}</p>`; return; }
  meses = d;
  // Carrega os KPIs globais em paralelo
  fetch(API()+'&action=despesasData').then(r=>r.json()).then(g=>{
    if (!g.error) { globalKPIs = g; if(currentView==='grid') renderGrid(); }
  }).catch(()=>{});
  renderGrid();
}

// ── Detalhe de um mês ─────────────────────────────────────────
let viewingFileId = null;
let viewingLabel = null;
let viewingIsCurrent = false;

async function openMes(fileId, label, isCurrent){
  currentView = 'detail';
  viewingFileId = fileId;
  viewingLabel = label;
  viewingIsCurrent = !!isCurrent;
  if (viewingIsCurrent) { movRecentesLoaded = false; movRecentes = []; }
  showDetailSkeleton(label);
  const r = await fetch(API()+`&action=despesasMes&fileId=${encodeURIComponent(fileId)}`);
  const d = await r.json();
  if (d.error) { $('app').innerHTML=`<button class="back-btn" onclick="showGrid()">‹ Voltar</button><p style="color:var(--coral)">${d.error}</p>`; return; }
  renderDetail(label, d, viewingIsCurrent);
}

function renderDetail(label, d, isCurrent){
  const cats = d.categorias || [];
  const maxVal = cats.length ? cats[0].total : 1;

  $('app').innerHTML = `
    <button class="back-btn" onclick="showGrid()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Todos os meses
    </button>
    <div style="font-size:18px;font-weight:700;margin-bottom:16px">${label}</div>

    <div class="kpi-row">
      <div class="kpi" style="--kpi-color:var(--mint)">
        <div class="kpi-label">Receitas</div>
        <div class="kpi-value">${eur(d.totalRec)}</div>
      </div>
      <div class="kpi" style="--kpi-color:var(--coral)">
        <div class="kpi-label">Despesas</div>
        <div class="kpi-value">${eur(d.totalDesp)}</div>
      </div>
      <div class="kpi" style="--kpi-color:var(--sapphire)">
        <div class="kpi-label">Poupanças</div>
        <div class="kpi-value">${eur(d.totalPoup)}</div>
      </div>
    </div>

    ${isCurrent ? `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div class="card-title" style="margin-bottom:0">ÚLTIMOS MOVIMENTOS</div>
        <button onclick="openAddMov()" style="background:#D2A13A;border:none;border-radius:8px;color:#1a1305;font-size:12px;font-weight:700;padding:6px 12px;cursor:pointer;font-family:inherit">+ Adicionar</button>
      </div>
      <div id="mov-recentes-list">${renderRecentesMovHTML()}</div>
    </div>` : ''}

    <div class="card">
      <div class="card-title">DESPESAS POR CATEGORIA</div>
      ${cats.map(c=>`
        <div class="cat-row">
          <div class="cat-name">${c.cat}</div>
          <div class="cat-bar-bg"><div class="cat-bar" style="width:${Math.round(c.total/maxVal*100)}%"></div></div>
          <div class="cat-val">${eur(c.total)}</div>
        </div>`).join('')}
    </div>`;

  if (isCurrent) loadRecentesMovimentos();
}

// ── Refresh ───────────────────────────────────────────────────
function refresh(){
  const btn = $('refresh-btn');
  btn.classList.add('spinning');
  if (currentView === 'detail' && viewingFileId) {
    openMes(viewingFileId, viewingLabel, viewingIsCurrent);
  } else {
    meses = [];
    globalKPIs = null;
    showGrid();
  }
}

// ── Arranque ─────────────────────────────────────────────────
Auth.protect(function(){
  $('app-content').style.display = 'block';
  Tickets.refreshBadge();
  Push.init();
  showGrid();
});
// ── Modal de adicionar movimento ──────────────────────────────
const CATEGORIAS_DESPESA = ['Saúde','Beleza','Supermercados','Telecom/Subscrições','Educação','Transportes','Vestuário','Desporto','Habitação','Restaurantes','Férias','Seguros','Diversos'];
const FIELD_STYLE = "width:100%;padding:10px;margin-top:6px;border-radius:9px;border:1px solid rgba(255,255,255,0.08);background:#181D26;color:#F2F4F7;font-size:14px;font-family:inherit";

function movFieldsConfig(tipo){
  if (tipo==='receita')  return { label1:'Fonte', type1:'text',   ph1:'ex: Salário',              label2:'Categoria', ph2:'opcional' };
  if (tipo==='poupanca') return { label1:'Tipo',  type1:'text',   ph1:'ex: Fundo Emergência',      label2:'Descrição', ph2:'opcional' };
  return                        { label1:'Categoria', type1:'select', ph1:'',                      label2:'Descrição', ph2:'opcional' };
}

function movCol1HTML(tipo, currentVal){
  const cfg = movFieldsConfig(tipo);
  if (cfg.type1==='select') {
    return `<select id="mv-col1" style="${FIELD_STYLE}">${CATEGORIAS_DESPESA.map(c=>`<option${c===currentVal?' selected':''}>${c}</option>`).join('')}</select>`;
  }
  return `<input id="mv-col1" type="text" value="${currentVal||''}" placeholder="${cfg.ph1}" style="${FIELD_STYLE}">`;
}

function updateMovFields(){
  const tipo = $('mv-tipo').value;
  const cfg = movFieldsConfig(tipo);
  $('mv-col1-label').textContent = cfg.label1;
  $('mv-col1-wrap').innerHTML = movCol1HTML(tipo);
  $('mv-col2-label').textContent = cfg.label2;
  $('mv-col2').placeholder = cfg.ph2;
}

function modalMovHTML(s){
  const isEdit = !!s;
  const v = s || {};
  const tipoAtual = v.tipo || 'despesa';
  const cfg = movFieldsConfig(tipoAtual);
  const today = new Date().toISOString().slice(0,10);
  return `
  <div id="mov-modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9000;display:flex;align-items:flex-end">
    <div style="background:#12161D;border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom))">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
        <div style="font-size:16px;font-weight:700">${isEdit?'Editar movimento':'Novo movimento'}</div>
        <button onclick="closeMovModal()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1">×</button>
      </div>
      ${isEdit?`<input type="hidden" id="mv-row" value="${v.row}">`:''}

      <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Tipo${isEdit?' <span style="text-transform:none;letter-spacing:0">(não editável)</span>':''}</label>
      <select id="mv-tipo" onchange="updateMovFields()" ${isEdit?'disabled':''} style="${FIELD_STYLE};margin:6px 0 14px${isEdit?';opacity:.55':''}">
        <option value="despesa"${tipoAtual==='despesa'?' selected':''}>Despesa</option>
        <option value="receita"${tipoAtual==='receita'?' selected':''}>Receita</option>
        <option value="poupanca"${tipoAtual==='poupanca'?' selected':''}>Poupança</option>
      </select>

      <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Data</label>
      <input id="mv-data" type="date" value="${isEdit?v.data.split('/').reverse().join('-'):today}" style="${FIELD_STYLE};margin:6px 0 14px">

      <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Valor (€)</label>
      <input id="mv-valor" type="number" step="0.01" value="${isEdit?v.valor:''}" placeholder="0.00" style="${FIELD_STYLE};margin:6px 0 14px">

      <label id="mv-col1-label" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">${cfg.label1}</label>
      <div id="mv-col1-wrap" style="margin:6px 0 14px">${movCol1HTML(tipoAtual, v.col1)}</div>

      <label id="mv-col2-label" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">${cfg.label2}</label>
      <input id="mv-col2" type="text" value="${isEdit?v.col2||'':''}" placeholder="${cfg.ph2}" style="${FIELD_STYLE};margin:6px 0 20px">

      <div id="mv-msg" style="font-size:12.5px;color:var(--coral);min-height:16px;margin-bottom:10px;text-align:center"></div>
      <button onclick="submitMov(${isEdit})" id="mv-submit"
        style="width:100%;padding:14px;border:none;border-radius:12px;background:#D2A13A;color:#1a1305;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit">
        ${isEdit?'Guardar alterações':'Adicionar movimento'}
      </button>
    </div>
  </div>`;
}

function openAddMov(){ document.body.insertAdjacentHTML('beforeend', modalMovHTML(null)); }
function openEditMov(m){ document.body.insertAdjacentHTML('beforeend', modalMovHTML(m)); }
function closeMovModal(){ const m=$('mov-modal'); if(m) m.remove(); }

async function submitMov(isEdit){
  const btn=$('mv-submit'), msg=$('mv-msg');
  btn.disabled=true; btn.textContent='A guardar...';

  const rawDate = $('mv-data').value;
  const data = rawDate ? rawDate.split('-').reverse().join('/') : '';
  const tipo = $('mv-tipo').value;
  const valor = ($('mv-valor').value||'').replace(',','.');
  const col1 = $('mv-col1').value.trim();
  const col2 = $('mv-col2').value.trim();

  if (!valor || Number(valor) <= 0) {
    msg.textContent = 'Indica um valor válido.';
    btn.disabled=false; btn.textContent=isEdit?'Guardar alterações':'Adicionar movimento';
    return;
  }

  const payload = { action: isEdit?'despesasEdit':'despesasAdd', pin:Auth.getStoredPin()||'', tipo, data, valor, col1, col2 };
  if (isEdit) payload.row = parseInt($('mv-row').value);

  try {
    const r = await fetch(Auth.API_URL+'?'+new URLSearchParams({action:payload.action,pin:payload.pin}),{
      method:'POST', body: JSON.stringify(payload)
    });
    const d = await r.json();
    if(!d.ok){ msg.textContent='Erro: '+(d.error||'desconhecido'); btn.disabled=false; btn.textContent=isEdit?'Guardar alterações':'Adicionar movimento'; return; }
    closeMovModal();
    globalKPIs = null; // recalcula quando voltar à grelha
    if (viewingFileId) openMes(viewingFileId, viewingLabel, viewingIsCurrent);
  } catch(e){
    msg.textContent='Erro de rede: '+e.message;
    btn.disabled=false; btn.textContent=isEdit?'Guardar alterações':'Adicionar movimento';
  }
}
</script>
</body>
</html>
