<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente Cinzento Escuro / Carvão -->
    <linearGradient id="grey-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4E53"/>
      <stop offset="50%" stop-color="#2B2D30"/>
      <stop offset="100%" stop-color="#18191A"/>
    </linearGradient>

    <!-- Gradiente Cinzento Claro / Prata Metalizado -->
    <linearGradient id="grey-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E4E8"/>
      <stop offset="70%" stop-color="#B0B5BD"/>
      <stop offset="100%" stop-color="#80858E"/>
    </linearGradient>
  </defs>

  <g transform="translate(150, 150)">
    <!-- LETRA D BASE (Cinzento Escuro) -->
    <path d="M 50,50 
             L 240,50 
             C 380,50 470,120 470,250 
             C 470,380 380,450 240,450 
             L 50,450 
             Z
             M 130,120 
             L 130,380 
             L 220,380 
             C 310,380 380,320 380,250 
             C 380,180 310,120 220,120 
             Z" 
          fill="url(#grey-dark)" 
          fill-rule="evenodd"/>

    <!-- DESTAQUE C (Cinzento Claro / Prata) -->
    <path d="M 270,50 
             C 390,50 470,130 470,250 
             C 470,370 390,450 270,450 
             L 210,380 
             C 320,380 380,320 380,250 
             C 380,180 310,120 210,120 
             L 270,50 
             Z" 
          fill="url(#grey-light)"/>
  </g>
</svg>
