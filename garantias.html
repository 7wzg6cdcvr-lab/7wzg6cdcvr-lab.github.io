<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0D12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>DC Garantias</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
@font-face{font-family:'Cybertruck';src:url('fonts/Cybertruck-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap;}
:root{
  --bg:#0A0D12;--surface:#12161D;--surface2:#181D26;--surface3:#212938;
  --border:rgba(255,255,255,0.08);--border-soft:rgba(255,255,255,0.05);
  --text:#F2F4F7;--muted:#8B95A5;--muted2:#5C6576;
  --gold:#D2A13A;--gold-light:#F4D27A;
  --mint:#34D399;--coral:#FF6B5E;--sapphire:#5B8DEF;--amber:#F0A93A;
  --r:16px;--r-sm:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;padding-bottom:calc(24px + env(safe-area-inset-bottom));overscroll-behavior-y:contain;}

.topbar{position:sticky;top:0;z-index:60;background:#0D1117;border-bottom:1px solid var(--border-soft);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;min-width:0;flex:1}
.brand-logo{height:110px;width:auto;display:block}
.icon-btn{background:var(--surface3);color:var(--text);border:1px solid var(--border);border-radius:10px;width:40px;height:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;text-decoration:none}
.icon-btn:active{transform:scale(.92)}

.app{padding:16px}

.gar-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.gar-card:active{transform:scale(.98)}
.gar-nome{font-size:15px;font-weight:700;margin-bottom:4px}
.gar-meta{font-size:12px;color:var(--muted);margin-bottom:10px}
.gar-dias{font-size:12px;font-weight:600;margin-bottom:6px}
.gar-bar-bg{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden}
.gar-bar{height:6px;border-radius:3px;transition:width .4s ease}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px}

.skel{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:var(--r-sm)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.add-fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));right:16px;background:var(--gold);color:#1a1305;border:none;border-radius:50%;width:56px;height:56px;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(210,161,58,.4);z-index:50}
.add-fab:active{transform:scale(.92)}
</style>
</head>
<body>
<div id="app-content" style="display:none">

<div class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <img class="brand-logo" src="logo.png" alt="DC Family">
      <span style="font-family:'Cybertruck',sans-serif;font-size:22px;letter-spacing:.06em;color:#B0B5BD;margin-left:8px">GARANTIAS</span>
    </div>
    <div style="display:flex;gap:8px">
      <a class="icon-btn" href="./index.html" title="Início">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      </a>
      <button class="icon-btn" id="refresh-btn" onclick="loadGarantias()" title="Atualizar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="app" id="app">
  <!-- preenchido pelo JS -->
</div>

<button class="add-fab" onclick="openAddGarantia()" title="Adicionar garantia">+</button>

</div>
<script src="auth.js"></script>
<script src="tickets.js"></script>
<script src="push.js"></script>
<script>
const $ = id => document.getElementById(id);
const API = () => Auth.API_URL + '?pin=' + encodeURIComponent(Auth.getStoredPin()||'');
const eur = v => '€'+Math.abs(v).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2});

const CATEGORIAS_GAR = ['Eletrodomésticos','Eletrónica','Automóvel','Casa','Saúde','Outros'];
const DURACOES = [1, 2, 3, 5, 10];
const FIELD_STYLE = "width:100%;padding:10px;margin-top:6px;border-radius:9px;border:1px solid rgba(255,255,255,0.08);background:#181D26;color:#F2F4F7;font-size:14px;font-family:inherit";

// ── Cores por estado ──────────────────────────────────────────
function estadoCor(dias, duracaoAnos) {
  if (dias < 0)  return { cor:'var(--coral)',  label:'Expirada',              pct: 100 };
  const total = duracaoAnos * 365;
  const pct   = Math.round((1 - dias / total) * 100);
  if (dias < 30) return { cor:'var(--coral)',  label:`${dias}d restantes`,    pct };
  if (dias < 90) return { cor:'var(--amber)',  label:`${dias}d restantes`,    pct };
  const meses = Math.floor(dias / 30);
  return         { cor:'var(--mint)',   label:`${meses} meses restantes`, pct };
}

// ── Renderiza a lista ─────────────────────────────────────────
function renderGarantias(list) {
  if (!list.length) {
    $('app').innerHTML = `<div class="empty">
      <div class="empty-icon">🛡️</div>
      <div style="font-size:15px;font-weight:700;margin-bottom:6px">Sem garantias registadas</div>
      <div style="font-size:13px">Toca no + para adicionar a primeira</div>
    </div>`;
    return;
  }
  $('app').innerHTML = list.map(g => {
    const { cor, label, pct } = estadoCor(g.diasRestantes, g.duracaoAnos);
    return `<div class="gar-card" onclick="openDetail(${JSON.stringify(g).replace(/"/g,'&quot;')})">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
        <div style="min-width:0">
          <div class="gar-nome">${g.nome}</div>
          <div class="gar-meta">${g.categoria}${g.categoria?' · ':''}Comprado em ${g.dataCompra} · ${g.duracaoAnos} ano${g.duracaoAnos>1?'s':''}</div>
        </div>
        <div style="font-size:11px;color:var(--muted2);flex-shrink:0;text-align:right">até ${g.dataFim}</div>
      </div>
      <div class="gar-dias" style="color:${cor}">${label}</div>
      <div class="gar-bar-bg"><div class="gar-bar" style="width:${Math.min(pct,100)}%;background:${cor}"></div></div>
    </div>`;
  }).join('');
}

// ── Carrega garantias ─────────────────────────────────────────
async function loadGarantias() {
  $('app').innerHTML = `${[1,2,3].map(()=>'<div class="skel" style="height:90px;margin-bottom:10px"></div>').join('')}`;
  try {
    const r = await fetch(API() + '&action=garantiasLista');
    const d = await r.json();
    if (!d.ok) { $('app').innerHTML = `<p style="color:var(--coral);padding:20px">${d.error}</p>`; return; }
    renderGarantias(d.garantias);
  } catch(e) {
    $('app').innerHTML = `<p style="color:var(--coral);padding:20px">Erro de rede: ${e.message}</p>`;
  }
}

// ── Modal de detalhe / apagar ─────────────────────────────────
function openDetail(g) {
  const { cor, label } = estadoCor(g.diasRestantes, g.duracaoAnos);
  document.body.insertAdjacentHTML('beforeend', `
  <div id="det-modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9000;display:flex;align-items:flex-end">
    <div style="background:#12161D;border-radius:20px 20px 0 0;width:100%;padding:20px 16px calc(20px + env(safe-area-inset-bottom))">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
        <div style="font-size:16px;font-weight:700">${g.nome}</div>
        <button onclick="$('det-modal').remove()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1">×</button>
      </div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">${g.categoria} · ${g.duracaoAnos} ano${g.duracaoAnos>1?'s':''}</div>
      <div style="font-size:13px;margin-bottom:4px">Comprado em <strong>${g.dataCompra}</strong></div>
      <div style="font-size:13px;margin-bottom:14px">Garantia até <strong>${g.dataFim}</strong></div>
      <div style="font-size:15px;font-weight:700;color:${cor};margin-bottom:20px">${label}</div>
      ${g.driveUrl ? `<a href="${g.driveUrl}" target="_blank" style="display:flex;align-items:center;gap:8px;background:var(--surface3);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);text-decoration:none;margin-bottom:14px;font-size:13px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
        Ver fatura
      </a>` : '<div style="font-size:13px;color:var(--muted2);margin-bottom:14px">Sem fatura anexada</div>'}
      <button onclick="confirmDelete(${g.row},'${g.nome.replace(/'/g,"\\'")}','${g.driveId}')" style="width:100%;padding:14px;border:none;border-radius:12px;background:var(--coral);color:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit">
        Eliminar garantia
      </button>
    </div>
  </div>`);
}

async function confirmDelete(row, nome, driveId) {
  if (!confirm(`Eliminar a garantia de "${nome}"?`)) return;
  $('det-modal').remove();
  try {
    const params = new URLSearchParams({ action:'garantiasDelete', pin:Auth.getStoredPin()||'', row, driveId });
    await fetch(Auth.API_URL + '?' + params.toString());
    loadGarantias();
  } catch(e) { alert('Erro: ' + e.message); }
}

// ── Modal de adicionar ────────────────────────────────────────
function openAddGarantia() {
  const today = new Date().toISOString().slice(0,10);
  document.body.insertAdjacentHTML('beforeend', `
  <div id="add-modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9000;display:flex;align-items:flex-end">
    <div style="background:#12161D;border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom))">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
        <div style="font-size:16px;font-weight:700">Nova garantia</div>
        <button onclick="$('add-modal').remove()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1">×</button>
      </div>

      <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Produto <span style="color:var(--coral)">*</span></label>
      <input id="g-nome" type="text" placeholder="ex: Samsung TV 65&quot;" style="${FIELD_STYLE};margin:6px 0 14px">

      <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Categoria</label>
      <select id="g-cat" style="${FIELD_STYLE};margin:6px 0 14px">
        ${CATEGORIAS_GAR.map(c=>`<option>${c}</option>`).join('')}
      </select>

      <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Data de compra <span style="color:var(--coral)">*</span></label>
      <input id="g-data" type="date" value="${today}" style="${FIELD_STYLE};margin:6px 0 14px">

      <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Duração da garantia <span style="color:var(--coral)">*</span></label>
      <select id="g-dur" style="${FIELD_STYLE};margin:6px 0 14px">
        ${DURACOES.map(d=>`<option value="${d}"${d===2?' selected':''}>${d} ano${d>1?'s':''}</option>`).join('')}
      </select>

      <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Fatura (foto ou PDF, opcional)</label>
      <input id="g-file" type="file" accept="image/*,application/pdf" style="${FIELD_STYLE};margin:6px 0 20px;padding:8px">

      <div id="g-msg" style="font-size:12.5px;color:var(--coral);min-height:16px;margin-bottom:10px;text-align:center"></div>
      <button onclick="submitGarantia()" id="g-submit" style="width:100%;padding:14px;border:none;border-radius:12px;background:#D2A13A;color:#1a1305;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit">
        Adicionar garantia
      </button>
    </div>
  </div>`);
}

async function submitGarantia() {
  const btn=$('g-submit'), msg=$('g-msg');
  btn.disabled=true; btn.textContent='A guardar...';
  const restore=()=>{ btn.disabled=false; btn.textContent='Adicionar garantia'; };

  const nome = $('g-nome').value.trim();
  const cat  = $('g-cat').value;
  const rawData = $('g-data').value;
  const dur  = $('g-dur').value;
  const file = $('g-file').files[0];

  if (!nome)    { msg.textContent='Indica o nome do produto.'; restore(); return; }
  if (!rawData) { msg.textContent='Indica a data de compra.'; restore(); return; }

  const dataCompra = rawData.split('-').reverse().join('/'); // dd/MM/yyyy

  // Lê o ficheiro como base64 se existir
  let filename='', filedata='', mimetype='';
  if (file) {
    if (file.size > 5 * 1024 * 1024) { msg.textContent='Ficheiro demasiado grande (máx. 5 MB).'; restore(); return; }
    filedata = await new Promise((res,rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(',')[1]);
      r.onerror = () => rej(new Error('Erro ao ler ficheiro'));
      r.readAsDataURL(file);
    });
    filename = file.name;
    mimetype = file.type;
  }

  const payload = {
    action: 'garantiasAdd',
    pin: Auth.getStoredPin()||'',
    nome, categoria: cat, dataCompra, duracaoAnos: dur,
    filename, filedata, mimetype,
  };

  try {
    const r = await fetch(Auth.API_URL + '?action=garantiasAdd&pin=' + encodeURIComponent(payload.pin), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    const d = await r.json();
    if (!d.ok) { msg.textContent='Erro: '+(d.error||'desconhecido'); restore(); return; }
    $('add-modal').remove();
    loadGarantias();
  } catch(e) {
    msg.textContent='Erro de rede: '+e.message;
    restore();
  }
}

// ── Arranque ──────────────────────────────────────────────────
Auth.protect(function(){
  $('app-content').style.display = 'block';
  Tickets.refreshBadge();
  Push.init();
  loadGarantias();
});
</script>
</body>
</html>
