<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DC Family">
<meta name="theme-color" content="#0A0D12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<title>DC Family</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

@font-face{
  font-family:'Cybertruck';
  src:url('fonts/Cybertruck-Regular.ttf') format('truetype');
  font-weight:400;font-style:normal;font-display:swap;
}

:root{
  --bg:#0A0D12; --surface:#12161D; --surface2:#181D26; --surface3:#212938;
  --border:rgba(255,255,255,0.08); --border-soft:rgba(255,255,255,0.05);
  --text:#F2F4F7; --muted:#8B95A5; --muted2:#5C6576;
  --gold:#D2A13A; --gold-light:#F4D27A;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  min-height:100vh;background:var(--bg);color:var(--text);
  font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
}
.logo{display:block;width:min(220px,55vw);height:auto;margin:0 auto -14px}
.tagline{
  font-family:'Cybertruck','Chakra Petch',sans-serif;font-weight:400;
  font-size:clamp(34px,11vw,50px);letter-spacing:.08em;text-transform:uppercase;
  margin:0 0 44px;
  color:var(--muted);
}

.tiles{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.tile{
  display:flex;align-items:center;gap:14px;
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:18px;text-decoration:none;color:inherit;
  transition:transform .15s ease, border-color .15s ease;
}
.tile:active{transform:scale(.98)}
.tile.active:hover{border-color:var(--gold)}
.tile-icon{
  width:44px;height:44px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface3);border:1px solid var(--border);color:var(--muted);
}
.tile-text{flex:1;min-width:0}
.tile-title{font-size:15.5px;font-weight:600}
.tile-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.tile-arrow{color:var(--muted2);font-size:18px;flex-shrink:0}

.tile.disabled{opacity:.45;cursor:default;pointer-events:none}
.badge-soon{
  font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted2);background:var(--surface3);border:1px solid var(--border);
  border-radius:6px;padding:3px 7px;flex-shrink:0;
}

.icon-btn{
  background:#212938;color:#F2F4F7;border:1px solid var(--border);
  border-radius:10px;width:34px;height:34px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.icon-btn:active{transform:scale(.92)}
.icon-btn:disabled{opacity:.5}
</style>
</head>
<body>

<div id="app-content" style="display:none">
<img class="logo" src="logo.png" alt="DC Family logo">

<div class="tiles">
  <a class="tile active" href="./portfolio.html">
    <div class="tile-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    </div>
    <div class="tile-text">
      <div class="tile-title">Portfolio</div>
      <div class="tile-sub">S&amp;P 500 &amp; Bitcoin</div>
    </div>
    <div class="tile-arrow">›</div>
  </a>

  <a class="tile active" href="./carro.html">
    <div class="tile-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h11l4 4 1 3H5"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M13 7l-1 6"/></svg>
    </div>
    <div class="tile-text">
      <div class="tile-title">Maximus</div>
      <div class="tile-sub">Carregamentos & custos</div>
    </div>
    <div class="tile-arrow">›</div>
  </a>

  <a class="tile active" href="./despesas.html">
    <div class="tile-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
    </div>
    <div class="tile-text">
      <div class="tile-title">Finances</div>
      <div class="tile-sub">Receitas, despesas & poupanças</div>
    </div>
    <div class="tile-arrow">›</div>
  </a>
</div>

<div style="display:flex;gap:8px;margin-top:22px">
  <button class="icon-btn" onclick="Tickets.open()" title="Tickets" aria-label="Tickets" style="position:relative">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted)">
      <path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4Z"/>
      <path d="M13 5v2M13 17v2M13 11v2"/>
    </svg>
    <span id="dm-t-badge" style="display:none;position:absolute;top:-6px;right:-6px;
      min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#FF6B5E;color:#1a0505;
      font-size:10px;font-weight:700;align-items:center;justify-content:center;border:2px solid var(--bg)"></span>
  </button>
  <button class="icon-btn" onclick="if(confirm('Sair? Vais precisar da password para voltar a entrar.')){Auth.logout();}" title="Sair" aria-label="Sair">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
  </button>
  <button id="dm-push-btn" class="icon-btn" onclick="enablePush()" title="Ativar notificações" aria-label="Ativar notificações" style="display:none">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
  </button>
</div>
<div id="dm-push-msg" style="font-size:11.5px;color:var(--muted2);margin-top:10px;min-height:15px;text-align:center"></div>
</div>

<script src="auth.js"></script>
<script src="tickets.js"></script>
<script src="push.js"></script>
<script>
  function enablePush(){
    // Chamado diretamente pelo clique, sem nada assíncrono antes —
    // é este isolamento que faz o Safari aceitar o pedido.
    const btn = document.getElementById('dm-push-btn');
    const msg = document.getElementById('dm-push-msg');
    btn.disabled = true;
    Push.requestPermission().then(result => {
      btn.disabled = false;
      if (result === 'granted') {
        msg.style.color = '#34D399'; msg.textContent = '✓ Notificações ativadas';
        btn.style.display = 'none';
      } else if (result === 'unsupported') {
        msg.style.color = '#FF6B5E'; msg.textContent = 'Este dispositivo/browser não suporta notificações.';
      } else {
        msg.style.color = '#FF6B5E'; msg.textContent = 'Permissão não concedida. Tenta novamente.';
      }
      setTimeout(() => { msg.textContent = ''; }, 5000);
    }).catch(e => {
      btn.disabled = false;
      msg.style.color = '#FF6B5E'; msg.textContent = 'Erro: ' + (e.message || e);
    });
  }

  Auth.protect(async function(){
    document.getElementById('app-content').style.display = 'flex';
    document.getElementById('app-content').style.flexDirection = 'column';
    document.getElementById('app-content').style.alignItems = 'center';
    Tickets.refreshBadge();
    Push.init();

    if (Push.isSupported() && !Push.alreadyEnabled()) {
      document.getElementById('dm-push-btn').style.display = 'flex';
    }

    const ticketNum = new URLSearchParams(location.search).get('ticket');
    if (ticketNum) Tickets.openTicket(parseInt(ticketNum, 10));
  });
</script>
</body>
</html>
