<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DC Portfolio">
<meta name="theme-color" content="#0A0D12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<title>DC Investments</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

@font-face{
  font-family:'Cybertruck';
  src:url('fonts/Cybertruck-Regular.ttf') format('truetype');
  font-weight:400;font-style:normal;font-display:swap;
}

:root{
  --bg:#0A0D12; --surface:#12161D; --surface2:#181D26; --surface3:#212938;
  --border:rgba(255,255,255,0.08); --border-soft:rgba(255,255,255,0.05);
  --text:#F2F4F7; --muted:#8B95A5; --muted2:#5C6576;
  --gold:#D2A13A; --gold-light:#F4D27A;
  --mint:#34D399; --coral:#FF6B5E;
  --sapphire:#5B8DEF; --violet:#A78BFA; --amber:#F0A93A;
  --r:16px; --r-sm:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  min-height:100vh;background:var(--bg);color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.up{color:var(--mint)!important}.down{color:var(--coral)!important}
.figure{font-family:'Fraunces',serif;font-optical-sizing:auto}
::selection{background:var(--gold);color:#0A0D12}

/* ── Topbar ── */
.topbar{
  position:sticky;top:0;z-index:60;background:#0D1117;
  border-bottom:1px solid var(--border-soft);
  padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));
}
.topbar-inner{display:flex;flex-direction:column;gap:10px}
.topbar-row1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1;overflow:hidden}
.brand .brand-logo{height:110px;width:auto;max-width:70%;flex-shrink:1;display:block}
.brand-portfolio-txt{font-family:'Futura','Century Gothic','Trebuchet MS',Arial,sans-serif;font-size:13px;font-weight:300;letter-spacing:.14em;color:var(--muted);flex-shrink:0}
.brand-family-txt{font-family:'Cybertruck',sans-serif;font-size:23px;letter-spacing:.06em;color:#B0B5BD;flex-shrink:0;line-height:1.1;margin-bottom:0}
.updated-txt{font-size:10.5px;color:var(--muted2);margin-top:2px}
.brand-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted2)}
.pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--mint);flex-shrink:0}
.pulse-dot.busy{background:var(--gold);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.refresh-btn{
  background:var(--surface3);color:var(--text);border:1px solid var(--border);
  border-radius:10px;width:34px;height:34px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.refresh-btn:active{transform:scale(.92)}
.refresh-btn.spinning svg{animation:spin .7s linear infinite}
.refresh-btn:disabled{opacity:.5}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Layout ── */
.app{padding:16px 16px 24px}
.tab{display:none;animation:fadein .2s ease}
.tab.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── Skeleton ── */
#skeleton{padding:16px}
.skel-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.skel{height:78px;border-radius:var(--r-sm);background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);
  background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}
.skel.tall{height:220px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── KPI ── */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--sapphire)}
.kpi.green::before{background:var(--mint)}
.kpi.red::before{background:var(--coral)}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.kpi-value{font-family:'DM Mono',monospace;font-size:clamp(16px,4.4vw,21px);font-weight:500;letter-spacing:-.2px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:5px;min-height:14px}
.alloc-row{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-top:7px}
.alloc-name{color:var(--muted)}
.alloc-pct{font-family:'DM Mono',monospace;font-weight:600;color:var(--text)}

/* ── Card ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px}

/* ── Info chips ── */
.info-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.info-chip{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 12px;min-width:0;overflow:hidden}
.info-label{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2);margin-bottom:3px}
.info-value{font-family:'DM Mono',monospace;font-size:clamp(12px,3.6vw,14px);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Owner accordion ── */
.owner-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.owner-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.owner-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;user-select:none}
.owner-name-row{display:flex;align-items:center;gap:9px;min-width:0}
.owner-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.owner-title{font-size:13px;font-weight:600;letter-spacing:.02em}
.owner-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.owner-pnl{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;white-space:nowrap}
.owner-arrow{font-size:10px;color:var(--muted2);transition:transform .2s}
.owner-card.open .owner-arrow{transform:rotate(180deg)}
.owner-body{max-height:0;overflow:hidden;transition:max-height .25s ease}
.owner-card.open .owner-body{max-height:220px}
.owner-body-inner{border-top:1px solid var(--border-soft);padding:10px 14px}
.owner-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border-soft)}
.owner-row:last-child{border:none}
.owner-row-l{font-size:12px;color:var(--muted)}
.owner-row-v{font-family:'DM Mono',monospace;font-size:12px}

/* ── Charts / gauge ── */
.chart-wrap{position:relative;width:100%;height:340px}
#gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}

/* ── Bottom nav ── */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;height:60px;
  background:#12161D;border-top:1px solid var(--border-soft);display:flex;z-index:100;
  padding-bottom:env(safe-area-inset-bottom);
}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;color:var(--muted2);cursor:pointer;padding:6px 0}
.navbtn.active{color:var(--gold-light)}
.navbtn:active{opacity:.6}
.nav-icon{font-size:19px;line-height:1}
.nav-label{font-size:10px;font-weight:500}
</style>
</head>

<script>
/* ── Utils ── */
const eur=v=>'€'+Math.abs(v).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2});

// POST ao Apps Script, com uma repetição automática — o XMLHttpRequest
// foi tentado como alternativa ao fetch mas causa bloqueio de CORS
// (o fetch é o que realmente funciona aqui); a repetição cobre falhas
// de rede pontuais, incluindo o "Load failed" ocasional no Safari/iOS.
async function postToScript(url, payload, _retried){
  try {
    const r = await fetch(url, { method: 'POST', body: JSON.stringify(payload) });
    return await r.json();
  } catch(e) {
    if (!_retried) {
      // Falha de rede pontual (comum no Safari/iOS) — espera um instante e tenta mais uma vez
      await new Promise(res => setTimeout(res, 800));
      return postToScript(url, payload, true);
    }
    throw e;
  }
}
const pct=v=>(v>=0?'+':'')+v.toFixed(2)+'%';
const sgn=v=>(v>=0?'+':'')+eur(v);
const cl =v=>v>=0?'up':'down';
const COLORS={DM:'#5B8DEF',LCD:'#34D399',RCD:'#A78BFA'};
const GRID='rgba(255,255,255,0.06)';
const $=id=>document.getElementById(id);
let ch={};
const dc=id=>{if(ch[id]){ch[id].destroy();delete ch[id];}};

Chart.defaults.color='#8B95A5';
Chart.defaults.font.family="'DM Sans',sans-serif";

/* ── Tabs ── */
function setTab(name, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
}
function toggleOwner(el){ el.closest('.owner-card').classList.toggle('open'); }

/* ── Load ── */
function loadData(){
  const btn=$('refresh-btn');
  btn.disabled=true; btn.classList.add('spinning');
  const pin = Auth.getStoredPin() || '';
  fetch(Auth.API_URL + '?action=data&pin=' + encodeURIComponent(pin))
    .then(r => r.json())
    .then(d => { if (d.error) throw new Error(d.error); onData(d); })
    .catch(onError);
}
function onError(e){
  const btn=$('refresh-btn');
  btn.disabled=false; btn.classList.remove('spinning');
  $('skeleton').innerHTML='<div class="card" style="border-color:var(--coral)"><div class="card-title">Erro</div><p style="color:var(--coral);font-size:13px">'+(e.message||e)+'</p></div>';
  $('skeleton').style.display='block';
  $('dashboard').style.display='none';
}
function onData(d){
  $('skeleton').style.display='none';
  $('dashboard').style.display='block';
  const btn=$('refresh-btn');
  btn.disabled=false; btn.classList.remove('spinning');
  renderAll(d);
}

/* ── Render ── */
function renderAll(d){
  const c=d.calc;
  $('updated-txt').textContent='Atualizado em '+d.updated;

  const isUp=c.totPnl>=0;
  $('kpi-inv').textContent=eur(c.totInv);
  $('kpi-val').textContent=eur(c.totVal);
  $('kpi-pnl-c').className='kpi '+(isUp?'green':'red');
  $('kpi-pnl').className='kpi-value '+(isUp?'up':'down');
  $('kpi-pnl').textContent=sgn(c.totPnl);
  $('kpi-pnl-s').textContent=pct(c.totPnlPct);
  const xtbAllocPct=c.totInv>0?pct((c.xtbInv/c.totInv)*100):'—';
  const btcAllocPct=c.totInv>0?pct((c.btcTotalInvested/c.totInv)*100):'—';
  $('kpi-alloc-sp').textContent=xtbAllocPct;
  $('kpi-alloc-btc').textContent=btcAllocPct;

  renderGauge(c);
  renderSXR8(d);
  renderBTC(d);
}

function renderGauge(c){
  const segments=[];
  ['DM','LCD','RCD'].forEach(o=>{ if(c.xtbOwners[o]) segments.push({label:'S&P 500 '+o, value:c.xtbOwners[o].currentValue, color:COLORS[o]}); });
  segments.push({label:'Bitcoin', value:c.btcVal, color:'#F0A93A'});
  const total=segments.reduce((s,x)=>s+x.value,0)||1;

  // O arco desenha-se da direita para a esquerda à medida que avança, por
  // isso ordenar do menor para o maior aqui resulta em maior→menor à vista,
  // da esquerda para a direita.
  const arcSegments=[...segments].sort((a,b)=>a.value-b.value);
  const legendSegments=[...segments].sort((a,b)=>b.value-a.value);

  const wrap=$('gauge-wrap');
  const W=Math.min(wrap.clientWidth || (window.innerWidth-64), 360), R=W*0.36, cx=W/2, cy=R+W*0.05, thick=W*0.115, GAP=0.026;
  let arcs='', pctLabels=''; let cumAngle=0;

  arcSegments.forEach((seg,idx)=>{
    const span=(seg.value/total)*Math.PI;
    const a0=cumAngle+GAP/2, a1=cumAngle+span-GAP/2;
    const sx=(cx+R*Math.cos(a0)).toFixed(1), sy=(cy-R*Math.sin(a0)).toFixed(1);
    const ex=(cx+R*Math.cos(a1)).toFixed(1), ey=(cy-R*Math.sin(a1)).toFixed(1);
    const large=span>Math.PI/2?1:0;
    arcs+=`<path d="M${sx},${sy} A${R},${R} 0 ${large},0 ${ex},${ey}" fill="none" stroke="${seg.color}" stroke-width="${thick}" stroke-linecap="butt"/>`;
    const amid=cumAngle+span/2;
    const lx=(cx+R*Math.cos(amid)).toFixed(1), ly=(cy-R*Math.sin(amid)).toFixed(1);
    const pctVal=(seg.value/total*100).toFixed(1);
    if(span>0.12) pctLabels+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#0A0D12" font-family="DM Sans,sans-serif" style="pointer-events:none">${pctVal}%</text>`;
    cumAngle+=span;
  });

  const legendRows=legendSegments.map(seg=>`<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 0;min-width:0">
    <span style="width:9px;height:9px;border-radius:2px;background:${seg.color};display:inline-block;flex-shrink:0"></span>
    <span style="color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${seg.label}</span>
    <span style="color:var(--text);font-family:'DM Mono',monospace;font-weight:600;flex-shrink:0;white-space:nowrap">${eur(seg.value)}</span>
  </div>`).join('');

  wrap.innerHTML=`<div style="width:${W}px;margin:0 auto">
    <svg viewBox="0 0 ${W} ${cy+8}" width="${W}" style="overflow:visible;display:block;margin:0 auto">${arcs}${pctLabels}</svg>
    <div style="display:flex;flex-direction:column;margin-top:6px;border-top:1px solid var(--border-soft);padding-top:2px">${legendRows}</div>
  </div>`;
}

/* ── SXR8 ── */
function renderSXR8(d){
  const c=d.calc;
  const owners=['DM','LCD','RCD'];
  const totI=owners.reduce((s,o)=>s+(c.xtbOwners[o]?.invested||0),0);
  const totV=owners.reduce((s,o)=>s+(c.xtbOwners[o]?.currentValue||0),0);
  const totP=totV-totI;
  const totShares=owners.reduce((s,o)=>s+(c.xtbOwners[o]?.shares||0),0);

  $('sxr8-info').innerHTML=`
    <div class="info-chip"><div class="info-label">Investido</div><div class="info-value">${eur(totI)}</div></div>
    <div class="info-chip"><div class="info-label">Valor Atual</div><div class="info-value">${eur(totV)}</div></div>
    <div class="info-chip"><div class="info-label">P&amp;L</div><div class="info-value ${cl(totP)}">${sgn(totP)}<span style="font-size:0.72em;opacity:0.8;margin-left:4px">(${pct((totP/totI)*100)})</span></div></div>
    <div class="info-chip"><div class="info-label">Preço Médio</div><div class="info-value">€${(totI/totShares).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})}</div></div>`;

function barChart(id,labels,datasets,stacked){
  return new Chart($(id),{type:'bar',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,
    scales:{
      x:{stacked,ticks:{color:'#8B95A5',font:{family:"'DM Sans'",size:9},maxRotation:55},grid:{display:false}},
      y:{stacked,ticks:{color:'#8B95A5',font:{family:"'DM Mono'",size:9},callback:v=>'€'+v},grid:{color:GRID}}
    },
    plugins:{
      legend:{labels:{color:'#8B95A5',font:{family:"'DM Sans'",size:11,weight:'500'},boxWidth:9,usePointStyle:true,padding:12}},
      tooltip:{backgroundColor:'#212938',borderColor:'rgba(255,255,255,0.1)',borderWidth:1,
        titleColor:'#8B95A5',bodyColor:'#F2F4F7',
        callbacks:{label:c=>' '+c.dataset.label+': €'+c.raw.toFixed(0)}}
    }
  }});
}
function lineChart(id,labels,datasets,yFmt){
  return new Chart($(id),{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,
    scales:{
      x:{ticks:{color:'#8B95A5',font:{family:"'DM Sans'",size:9},maxRotation:55},grid:{display:false}},

async function submitBTC(isEdit){
  const btn=$('btc-submit'), msg=$('btc-msg');
  btn.disabled=true; btn.textContent='A guardar...';
  const restore=()=>{ btn.disabled=false; btn.textContent=isEdit?'Guardar alterações':'Adicionar transação'; };

  const rawDate = $('btc-data').value; // yyyy-mm-dd (formato nativo do <input type=date>)
  const date = rawDate ? rawDate.split('-').reverse().join('/') : ''; // dd/mm/yyyy — formato que o Code.gs espera
  const coin = $('btc-coin').value.trim() || 'BTC';
  const qty = ($('btc-qty').value||'').replace(',','.');
  const eurVal = ($('btc-eur').value||'').replace(',','.');
  const tipo = $('btc-tipo').value;
  const location = $('btc-location').value.trim();
  const obs = $('btc-obs').value.trim();

  if (!qty || Number(qty) <= 0) { msg.textContent='Indica a quantidade.'; restore(); return; }
  if (!eurVal || Number(eurVal) <= 0) { msg.textContent='Indica o valor investido.'; restore(); return; }

  const payload = {
    action: isEdit?'btcEdit':'btcAdd',
    pin: Auth.getStoredPin()||'',
    date, coin, qty, eur: eurVal, type: tipo, location, obs,
  };
  if (isEdit) payload.row = parseInt($('btc-row').value);

  try {
    const url = Auth.API_URL+'?'+new URLSearchParams({action:payload.action,pin:payload.pin});
    const d = await postToScript(url, payload);
    if(!d.ok){ msg.textContent='Erro: '+(d.error||'desconhecido'); restore(); return; }
    closeBTCModal();
    loadData();        // recalcula KPIs, gauge, owners e gráficos
    loadBTCRecentes();  // atualiza a lista de últimas compras
  } catch(e){
    msg.textContent='Erro de rede: '+e.message;
    restore();
  }
}

  if (!quantity || Number(quantity) <= 0) { msg.textContent='Indica a Quantity.'; restore(); return; }
  if (!price || Number(price) <= 0) { msg.textContent='Indica o Price per Share.'; restore(); return; }
  if (!owner) { msg.textContent='Indica o Owner.'; restore(); return; }

  const payload = {
    action: isEdit?'xtbEdit':'xtbAdd',
    pin: Auth.getStoredPin()||'',
    type, ticker, instrument, time, amount, id, quantity, price, owner,
  };
  if (isEdit) payload.row = parseInt($('xtb-row').value);

  try {
    const url = Auth.API_URL+'?'+new URLSearchParams({action:payload.action,pin:payload.pin});
    const d = await postToScript(url, payload);
    if(!d.ok){ msg.textContent='Erro: '+(d.error||'desconhecido'); restore(); return; }
    closeXTBModal();
    loadData();        // recalcula KPIs, gauge, owners e gráficos
    loadXTBRecentes();  // atualiza a lista de últimas compras
  } catch(e){
    msg.textContent='Erro de rede: '+e.message;
    restore();
  }
}

Auth.protect(function(){
  document.getElementById('app-content').style.display = 'block';
  loadData();
  loadBTCRecentes();
  loadXTBRecentes();
  Tickets.refreshBadge();
  Push.init();
});
</script>
</body>
</html>
