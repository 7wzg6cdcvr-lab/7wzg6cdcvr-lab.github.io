<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DC Carro">
<meta name="theme-color" content="#0A0D12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<title>DC Maximus</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

@font-face{
  font-family:'Cybertruck';
  src:url('fonts/Cybertruck-Regular.ttf') format('truetype');
  font-weight:400;font-style:normal;font-display:swap;
}

:root{
  --bg:#0A0D12; --surface:#12161D; --surface2:#181D26; --surface3:#212938;
  --border:rgba(255,255,255,0.08); --border-soft:rgba(255,255,255,0.05);
  --text:#F2F4F7; --muted:#8B95A5; --muted2:#5C6576;
  --gold:#D2A13A; --gold-light:#F4D27A;
  --mint:#34D399; --coral:#FF6B5E;
  --sapphire:#5B8DEF; --violet:#A78BFA; --amber:#F0A93A;
  --r:16px; --r-sm:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  min-height:100vh;background:var(--bg);color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
::selection{background:var(--gold);color:#0A0D12}

/* ── Topbar ── */
.topbar{
  position:sticky;top:0;z-index:60;background:#0D1117;
  border-bottom:1px solid var(--border-soft);
  padding:18px 16px;padding-top:calc(18px + env(safe-area-inset-top));
}
.topbar-inner{display:flex;flex-direction:column;gap:10px}
.topbar-row1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1;overflow:hidden}
.brand .brand-logo{height:110px;width:auto;max-width:70%;flex-shrink:1;display:block}
.brand-sub-txt{font-family:'Futura','Century Gothic','Trebuchet MS',Arial,sans-serif;font-size:13px;font-weight:300;letter-spacing:.14em;color:var(--muted);flex-shrink:0}
.brand-family-txt{font-family:'Cybertruck',sans-serif;font-size:23px;letter-spacing:.06em;color:#B0B5BD;flex-shrink:0;line-height:1.1}
.updated-txt{font-size:10.5px;color:var(--muted2);margin-top:2px}

.refresh-btn{
  background:var(--surface3);color:var(--text);border:1px solid var(--border);
  border-radius:10px;width:34px;height:34px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.refresh-btn:active{transform:scale(.92)}
.refresh-btn.spinning svg{animation:spin .7s linear infinite}
.refresh-btn:disabled{opacity:.5}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Layout ── */
.app{padding:16px 16px 24px}

/* ── Skeleton ── */
#skeleton{padding:16px}
.skel-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.skel{height:78px;border-radius:var(--r-sm);background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);
  background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}
.skel.tall{height:220px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── KPI ── */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--amber)}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.kpi-value{font-family:'DM Mono',monospace;font-size:clamp(16px,4.4vw,21px);font-weight:500;letter-spacing:-.2px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:5px;min-height:14px}

/* ── Card ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px}

/* ── Charts ── */
.chart-wrap{position:relative;width:100%;height:280px}

/* ── Tabela de operadores ── */
.op-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border-soft)}
.op-row:last-child{border:none}
.op-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.op-name{flex:1;min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op-sub{font-size:11px;color:var(--muted2);margin-top:1px}
.op-right{text-align:right;flex-shrink:0}
.op-gasto{font-family:'DM Mono',monospace;font-size:13px;font-weight:600}
.op-kwh{font-size:10.5px;color:var(--muted);margin-top:1px}
</style>
</head>
<body>

<div id="app-content" style="display:none">
<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-row1">
      <div class="brand">
        <div style="display:flex;align-items:center">
          <img src="logo.png" alt="DC Family" class="brand-logo">
          <span style="font-family:'DM Sans',sans-serif;font-weight:600;font-size:14px;color:#F2F4F7;margin-left:8px;background:var(--surface3);border:1px solid var(--border);padding:6px 14px;border-radius:20px">Maximus</span>
        </div>
        <span class="updated-txt" id="updated-txt">a carregar…</span>
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0">
        <a class="refresh-btn" href="./index.html" title="Início" aria-label="Início" style="text-decoration:none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        </a>
        <button class="refresh-btn" id="refresh-btn" onclick="loadData()" title="Atualizar" aria-label="Atualizar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="app">

  <div id="skeleton">
    <div class="skel-row"><div class="skel"></div><div class="skel"></div></div>
    <div class="skel tall"></div>
  </div>

  <div id="dashboard" style="display:none">
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Total Gasto</div><div class="kpi-value" id="kpi-gasto">—</div><div class="kpi-sub" id="kpi-sessoes">&nbsp;</div></div>
      <div class="kpi"><div class="kpi-label">Total kWh</div><div class="kpi-value" id="kpi-kwh">—</div><div class="kpi-sub">&nbsp;</div></div>
      <div class="kpi"><div class="kpi-label">Custo Médio /kWh</div><div class="kpi-value" id="kpi-custo-kwh">—</div><div class="kpi-sub">&nbsp;</div></div>
      <div class="kpi"><div class="kpi-label">Custo Médio /100km</div><div class="kpi-value" id="kpi-custo-km">—</div><div class="kpi-sub" id="kpi-kms">&nbsp;</div></div>
    </div>

    <div class="card">
      <div class="card-title">GASTO MENSAL (€)</div>
      <div class="chart-wrap"><canvas id="chart-mensal"></canvas></div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div class="card-title" style="margin-bottom:0">ÚLTIMOS CARREGAMENTOS</div>
        <button onclick="openAdd()" style="background:#D2A13A;border:none;border-radius:8px;color:#1a1305;font-size:12px;font-weight:700;padding:6px 12px;cursor:pointer;font-family:inherit">+ Adicionar</button>
      </div>
      <div id="recentes-list" style="color:var(--muted);font-size:13px">A carregar…</div>
    </div>

    <div class="card">
      <div class="card-title">POR OPERADOR</div>
      <div id="op-list"></div>
    </div>
  </div>
</div>
</div>

<script src="auth.js"></script>
<script src="tickets.js"></script>
<script src="push.js"></script>
<script>
const eur=v=>'€'+Math.abs(v).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2});

// POST ao Apps Script, com uma repetição automática — o XMLHttpRequest
// foi tentado como alternativa ao fetch mas causa bloqueio de CORS
// (o fetch é o que realmente funciona aqui); a repetição cobre falhas
// de rede pontuais, incluindo o "Load failed" ocasional no Safari/iOS.
async function postToScript(url, payload) {
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return await r.json();
}
const $=id=>document.getElementById(id);
const OP_COLORS=['#F0A93A','#5B8DEF','#34D399','#A78BFA','#FF6B5E','#8B95A5'];
let ch={};
const dc=id=>{if(ch[id]){ch[id].destroy();delete ch[id];}};

Chart.defaults.color='#8B95A5';
Chart.defaults.font.family="'DM Sans',sans-serif";

function loadData(){
  const btn=$('refresh-btn');
  btn.disabled=true; btn.classList.add('spinning');
  const pin = Auth.getStoredPin() || '';
  const url = Auth.API_URL + '?' + new URLSearchParams({ action:'carroData', pin }).toString();
  fetch(url)
    .then(r => r.json())
    .then(d => { if (d.error) throw new Error(d.error); onData(d); })
    .catch(onError);
}
function onError(e){
  const btn=$('refresh-btn');
  btn.disabled=false; btn.classList.remove('spinning');
  $('skeleton').innerHTML='<div class="card" style="border-color:var(--coral)"><div class="card-title">Erro</div><p style="color:var(--coral);font-size:13px">'+(e.message||e)+'</p></div>';
  $('skeleton').style.display='block';
  $('dashboard').style.display='none';
}
function onData(d){
  $('skeleton').style.display='none';
  $('dashboard').style.display='block';
  const btn=$('refresh-btn');
  btn.disabled=false; btn.classList.remove('spinning');
  $('updated-txt').textContent='Atualizado em '+d.updated;

  $('kpi-gasto').textContent=eur(d.totalGasto);
  $('kpi-sessoes').textContent=d.numSessoes+' carregamentos';
  $('kpi-kwh').textContent=d.totalKwh.toLocaleString('pt-PT',{minimumFractionDigits:1,maximumFractionDigits:1})+' kWh';
  $('kpi-custo-kwh').textContent='€'+d.custoMedioKwh.toFixed(3);
  $('kpi-custo-km').textContent='€'+d.custoMedioKm.toFixed(2);
  $('kpi-kms').textContent=Math.round(d.totalKms).toLocaleString('pt-PT')+' km percorridos';

  renderChart(d.monthly);
  renderOperadores(d.operadores);
}

function renderChart(monthly){
  const labels=monthly.map(m=>m.label);
  const ds=[{label:'Gasto',data:monthly.map(m=>m.gasto),backgroundColor:'#F0A93Acc',borderRadius:4}];
  dc('chart-mensal');
  ch['chart-mensal']=new Chart($('chart-mensal'),{type:'bar',data:{labels,datasets:ds},options:{
    responsive:true,maintainAspectRatio:false,
    scales:{
      x:{ticks:{color:'#8B95A5',font:{family:"'DM Sans'",size:9},maxRotation:55},grid:{display:false}},
      y:{ticks:{color:'#8B95A5',font:{family:"'DM Mono'",size:9},callback:v=>'€'+v},grid:{color:'rgba(255,255,255,0.06)'}}
    },
    plugins:{
      legend:{display:false},
      tooltip:{backgroundColor:'#212938',borderColor:'rgba(255,255,255,0.1)',borderWidth:1,
        titleColor:'#8B95A5',bodyColor:'#F2F4F7',
        callbacks:{label:c=>' '+eur(c.raw)}}
    }
  }});
}

function renderOperadores(ops){
  $('op-list').innerHTML = ops.map((o,i)=>`
    <div class="op-row">
      <span class="op-dot" style="background:${OP_COLORS[i%OP_COLORS.length]}"></span>
      <div class="op-name-wrap" style="flex:1;min-width:0">
        <div class="op-name">${o.nome}</div>
        <div class="op-sub">${o.sessoes} carregamento${o.sessoes>1?'s':''} · €${o.precoMedioKwh.toFixed(3)}/kWh</div>
      </div>
      <div class="op-right">
        <div class="op-gasto">${eur(o.gasto)}</div>
        <div class="op-kwh">${o.kwh.toLocaleString('pt-PT',{maximumFractionDigits:0})} kWh</div>
      </div>
    </div>
  `).join('');
}

Auth.protect(function(){
  document.getElementById('app-content').style.display = 'block';
  loadData();
  loadRecentes();
  if (window.Tickets) Tickets.refreshBadge();
  Push.init();
});

// ── Últimos 5 carregamentos ───────────────────────────────────
async function loadRecentes(){
  const r = await fetch(Auth.API_URL+'?'+new URLSearchParams({action:'carroRecentes',pin:Auth.getStoredPin()||''}));
  const d = await r.json();
  if (!d.ok || !d.sessions.length) return;
  renderRecentes(d.sessions);
}

function fmtKwh(v){ return v ? v.toLocaleString('pt-PT',{minimumFractionDigits:1,maximumFractionDigits:1})+' kWh' : '—'; }

function renderRecentes(sessions){
  $('recentes-list').innerHTML = sessions.map(s=>`
    <div style="display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer"
         onclick="openEdit(${JSON.stringify(s).replace(/"/g,'&quot;')})">
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.carregador||'—'}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">${s.data} · ${fmtKwh(s.kwh)} · ${s.tipo||'—'}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-family:'DM Mono',monospace;font-size:13px;font-weight:600">${s.preco?eur(s.preco):'—'}</div>
        ${s.precoKwh ? `<div style="font-size:10.5px;font-weight:600;color:${s.precoKwh<0.49?'#34D399':s.precoKwh===0.49?'#F0A93A':'#FF6B5E'}">€${s.precoKwh.toFixed(3)}/kWh</div>` : ''}
        ${s.desconto ? `<div style="font-size:10px;color:#34D399">-${eur(s.desconto)} desc.</div>` : ''}
        <div style="font-size:10.5px;color:var(--muted2)">✏️ editar</div>
      </div>
    </div>`).join('');
}

// ── Listas dinâmicas — carregadas da aba "Categorias" da folha do Carro ──
let TIPOS      = ['CCS','TYPE 2'];
let OPERADORES = ['Atlante','Continente','Tesla','EVIO','Electroverse','Casa','Outros'];
let carroCategoriasLoaded = false;

function loadCarroCategorias(){
  if (carroCategoriasLoaded) return Promise.resolve();
  const pin = Auth.getStoredPin() || '';
  return fetch(Auth.API_URL + '?action=carroCategorias&pin=' + encodeURIComponent(pin))
    .then(r => r.json())
    .then(d => {
      if (d.ok) {
        if (d.tipos && d.tipos.length)      TIPOS      = d.tipos;
        if (d.operadores && d.operadores.length) OPERADORES = d.operadores;
        carroCategoriasLoaded = true;
      }
    })
    .catch(() => {});
}

function modalHTML(s){
  const isEdit = !!s;
  const v = s || {};
  return `
  <div id="carro-modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9000;display:flex;align-items:flex-end">
    <div style="background:#12161D;border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom))">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
        <div style="font-size:16px;font-weight:700">${isEdit?'Editar carregamento':'Novo carregamento'}</div>
        <button onclick="closeModal()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1">×</button>
      </div>
      ${isEdit?`<input type="hidden" id="cm-row" value="${v.row}">`:''}

      <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Data</label>
      <input id="cm-data" type="date" value="${isEdit?v.data.split('/').reverse().join('-'):new Date().toISOString().slice(0,10)}"
        style="width:100%;padding:10px;margin:6px 0 14px;border-radius:9px;border:1px solid rgba(255,255,255,0.08);background:#181D26;color:#F2F4F7;font-size:14px;font-family:inherit">

      <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Carregador</label>
      <div style="display:flex;gap:8px;align-items:center;margin:6px 0 14px">
        <input id="cm-carregador" type="text" value="${v.carregador||(!isEdit?'Continente S. Marcos':'')}" placeholder="ex: Continente S. Marcos"
          style="flex:1;padding:10px;border-radius:9px;border:1px solid rgba(255,255,255,0.08);background:#181D26;color:#F2F4F7;font-size:14px;font-family:inherit">
        <button type="button" title="Repor favorito" onclick="document.getElementById('cm-carregador').value='Continente S. Marcos'"
          style="flex-shrink:0;background:#181D26;border:1px solid rgba(255,255,255,0.08);border-radius:9px;padding:10px 11px;cursor:pointer;font-size:15px;line-height:1">⭐</button>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px">
        <div>
          <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">kWh</label>
          <input id="cm-kwh" type="number" step="0.01" inputmode="decimal" value="${v.kwh||''}" placeholder="0.00"
            style="width:100%;padding:10px;margin-top:6px;border-radius:9px;border:1px solid rgba(255,255,255,0.08);background:#181D26;color:#F2F4F7;font-size:14px;font-family:inherit">
        </div>
        <div>
          <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Preço (€)</label>
          <input id="cm-preco" type="number" step="0.01" inputmode="decimal" value="${v.preco||''}" placeholder="0.00"
            oninput="calcPrecoLiquido()"
            style="width:100%;padding:10px;margin-top:6px;border-radius:9px;border:1px solid rgba(255,255,255,0.08);background:#181D26;color:#F2F4F7;font-size:14px;font-family:inherit">
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px">
        <div></div>
        <div>
          <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Desconto (€)</label>
          <input id="cm-desconto" type="number" step="0.01" min="0" inputmode="decimal" value="${v.desconto||''}" placeholder="0.00 (opcional)"
            oninput="calcPrecoLiquido()"
            style="width:100%;padding:10px;margin-top:6px;border-radius:9px;border:1px solid rgba(255,255,255,0.08);background:#181D26;color:#F2F4F7;font-size:14px;font-family:inherit">
        </div>
      </div>
      <div id="cm-preco-liquido" style="font-size:11.5px;color:#34D399;min-height:16px;margin-bottom:10px;text-align:right"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
        <div>
          <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Tipo</label>
          <select id="cm-tipo" style="width:100%;padding:10px;margin-top:6px;border-radius:9px;border:1px solid rgba(255,255,255,0.08);background:#181D26;color:#F2F4F7;font-size:14px;font-family:inherit">
            ${TIPOS.map(t=>`<option${(v.tipo||'')==t?' selected':''}>${t}</option>`).join('')}
          </select>
        </div>
        <div>
          <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Operador</label>
          <select id="cm-operador" style="width:100%;padding:10px;margin-top:6px;border-radius:9px;border:1px solid rgba(255,255,255,0.08);background:#181D26;color:#F2F4F7;font-size:14px;font-family:inherit">
            ${OPERADORES.map(o=>`<option${(v.operador||'')==o?' selected':''}>${o}</option>`).join('')}
          </select>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
        <div>
          <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Minutos</label>
          <input id="cm-minutos" type="number" inputmode="numeric" value="${v.minutos||''}" placeholder="—"
            style="width:100%;padding:10px;margin-top:6px;border-radius:9px;border:1px solid rgba(255,255,255,0.08);background:#181D26;color:#F2F4F7;font-size:14px;font-family:inherit">
        </div>
        <div>
          <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Odómetro (km)</label>
          <input id="cm-kms" type="number" inputmode="numeric" value="${v.kms||''}" placeholder="—"
            style="width:100%;padding:10px;margin-top:6px;border-radius:9px;border:1px solid rgba(255,255,255,0.08);background:#181D26;color:#F2F4F7;font-size:14px;font-family:inherit">
        </div>
      </div>

      <label style="display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer">
        <input id="cm-carga-total" type="checkbox" ${v.cargaTotal?'checked':''}
          style="width:18px;height:18px;accent-color:#D2A13A">
        <span style="font-size:13px;color:#F2F4F7">Carga completa (100%)</span>
      </label>

      <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Observações</label>
      <input id="cm-obs" type="text" value="${v.obs||''}" placeholder="opcional"
        style="width:100%;padding:10px;margin:6px 0 20px;border-radius:9px;border:1px solid rgba(255,255,255,0.08);background:#181D26;color:#F2F4F7;font-size:14px;font-family:inherit">

      <div id="cm-msg" style="font-size:12.5px;color:var(--coral);min-height:16px;margin-bottom:10px;text-align:center"></div>
      <button onclick="submitModal(${isEdit?1:0})" id="cm-submit"
        style="width:100%;padding:14px;border:none;border-radius:12px;background:#D2A13A;color:#1a1305;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit">
        ${isEdit?'Guardar alterações':'Adicionar carregamento'}
      </button>
    </div>
  </div>`;
}

function openAdd(){ loadCarroCategorias().then(() => document.body.insertAdjacentHTML('beforeend', modalHTML(null))); }
function openEdit(s){ loadCarroCategorias().then(() => document.body.insertAdjacentHTML('beforeend', modalHTML(s))); }
function closeModal(){ const m=$('carro-modal'); if(m) m.remove(); }

function getVal(id){ return document.getElementById(id)?.value.trim()||''; }

function calcPrecoLiquido(){
  const preco    = parseFloat(getVal('cm-preco').replace(',','.')) || 0;
  const desconto = parseFloat(getVal('cm-desconto').replace(',','.')) || 0;
  const el = document.getElementById('cm-preco-liquido');
  if (!el) return;
  el.textContent = (desconto > 0 && preco > 0)
    ? 'Preço líquido: €' + Math.max(0, preco - desconto).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})
    : '';
}

async function submitModal(isEdit){
  const btn=$('cm-submit');
  const msg=$('cm-msg');
  btn.disabled=true; btn.textContent='A guardar...';
  const restore = () => { btn.disabled=false; btn.textContent=isEdit?'Guardar alterações':'Adicionar carregamento'; };

  // Converte data de yyyy-MM-dd para dd/MM/yyyy
  const rawDate = getVal('cm-data');
  const data = rawDate ? rawDate.split('-').reverse().join('/') : '';
  const carregador = getVal('cm-carregador').trim();
  const kwh = getVal('cm-kwh').replace(',','.');
  const preco = getVal('cm-preco').replace(',','.');
  const tipo = getVal('cm-tipo');
  const operador = getVal('cm-operador');
  const kms = getVal('cm-kms').trim();

  // Validação — Minutos e Obs são opcionais, todo o resto é obrigatório
  if (!data)     { msg.textContent='Indica a data.'; restore(); return; }
  if (!carregador) { msg.textContent='Indica o carregador.'; restore(); return; }
  if (!kwh || Number(kwh) <= 0)   { msg.textContent='Indica os kWh.'; restore(); return; }
  if (!preco || Number(preco) < 0) { msg.textContent='Indica o preço.'; restore(); return; }
  if (!tipo)     { msg.textContent='Indica o tipo de conector.'; restore(); return; }
  if (!operador) { msg.textContent='Indica o operador.'; restore(); return; }
  if (!kms || Number(kms) <= 0)   { msg.textContent='Indica o odómetro (kms).'; restore(); return; }

  const payload = {
    action: isEdit ? 'carroEdit' : 'carroAdd',
    pin: Auth.getStoredPin()||'',
    data, carregador, kwh, preco, tipo, operador,
    minutos: getVal('cm-minutos'),
    kms,
    obs: getVal('cm-obs'),
    cargaTotal: document.getElementById('cm-carga-total').checked,
    desconto: getVal('cm-desconto').replace(',','.'),
  };
  if(isEdit) payload.row = parseInt(getVal('cm-row'));

  try {
    const url = Auth.API_URL+'?'+new URLSearchParams({action:payload.action,pin:payload.pin});
    const d = await postToScript(url, payload);
    if(!d.ok){ msg.textContent='Erro: '+(d.error||'desconhecido'); btn.disabled=false; btn.textContent=isEdit?'Guardar alterações':'Adicionar carregamento'; return; }
    closeModal();
    loadData();
    loadRecentes();
  } catch(e){
    msg.textContent='Erro de rede: '+e.message;
    btn.disabled=false; btn.textContent=isEdit?'Guardar alterações':'Adicionar carregamento';
  }
}
</script>
</body>
</html>
